<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANDATE · Asset Review</title>
    <style>
      :root {
        --paper: #f3e9d2;
        --card: #fbf6ea;
        --ink: #2b2118;
        --muted: #7a6a58;
        --line: #d9cbb0;
        --stamp: #b3261e;
        --ok: #2e6b2f;
        font-family: system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      body {
        margin: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        padding: 0.75rem 1.25rem;
        background: var(--ink);
        color: var(--paper);
      }
      header h1 {
        margin: 0 1rem 0 0;
        font-size: 1.1rem;
        letter-spacing: 0.1em;
      }
      header button {
        background: transparent;
        color: var(--paper);
        border: 1px solid #6b5d4f;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }
      header button[aria-pressed='true'] {
        background: var(--paper);
        color: var(--ink);
      }
      header .hint {
        margin-left: auto;
        font-size: 0.8rem;
        opacity: 0.7;
      }
      main {
        padding: 1.25rem;
        display: grid;
        gap: 1.25rem;
      }
      .asset {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1rem;
      }
      .asset h2 {
        margin: 0;
        font-size: 1rem;
        font-family: ui-monospace, monospace;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.1rem 0.5rem;
        border-radius: 3px;
        border: 1px solid currentColor;
      }
      .status-todo {
        color: var(--muted);
      }
      .status-generated {
        color: #8a5a00;
      }
      .status-picked {
        color: var(--stamp);
      }
      .status-final {
        color: var(--ok);
      }
      .meta {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .desc {
        margin: 0.5rem 0;
        max-width: 70ch;
      }
      details pre {
        white-space: pre-wrap;
        font-size: 0.75rem;
        background: #fff;
        border: 1px solid var(--line);
        padding: 0.75rem;
        max-height: 22rem;
        overflow: auto;
      }
      .variants {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      figure {
        margin: 0;
        position: relative;
        border: 2px solid transparent;
        border-radius: 4px;
        background: #fff;
      }
      figure.picked {
        border-color: var(--stamp);
      }
      figure .frame {
        position: relative;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        cursor: zoom-in;
      }
      .transparent .frame {
        background-color: #fff;
        background-image:
          linear-gradient(45deg, #ddd 25%, transparent 25%),
          linear-gradient(-45deg, #ddd 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #ddd 75%),
          linear-gradient(-45deg, transparent 75%, #ddd 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
      }
      .sheet .frame::before,
      .sheet .frame::after {
        content: '';
        position: absolute;
        background: rgba(179, 38, 30, 0.45);
        pointer-events: none;
      }
      .sheet .frame::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .sheet .frame::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.4rem 0.5rem;
        font-size: 0.8rem;
      }
      .stamp {
        font: 700 0.75rem/1 system-ui;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 2px solid var(--stamp);
        color: var(--stamp);
        background: transparent;
        padding: 0.3rem 0.6rem;
        border-radius: 3px;
        cursor: pointer;
      }
      .stamp.on {
        background: var(--stamp);
        color: #fff;
        transform: rotate(-3deg);
      }
      .actions {
        margin-top: 0.75rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .actions button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.3rem 0.6rem;
        cursor: pointer;
      }
      textarea {
        width: min(100%, 40rem);
        min-height: 2.5rem;
        font: inherit;
        font-size: 0.85rem;
      }
      .slices {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .slices figure {
        width: 140px;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
      }
      #error {
        color: var(--stamp);
        padding: 0 1.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MANDATE · ASSET REVIEW</h1>
      <div class="row" id="filters"></div>
      <span class="hint"
        >Click an image to open full size · Pick stamps the variant · Then run npm run
        assets:optimize</span
      >
    </header>
    <p id="error" role="alert"></p>
    <main id="list"></main>

    <script type="module">
      const FILTERS = ['all', 'todo', 'generated', 'picked', 'final'];
      let filter = 'generated';
      let data = { assets: [] };

      const $ = (tag, attrs = {}, ...children) => {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') el.className = v;
          else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else if (v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
        }
        el.append(...children.flat().filter((c) => c !== null && c !== undefined));
        return el;
      };

      async function api(path, body) {
        const res = await fetch(
          path,
          body
            ? {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
              }
            : {},
        );
        const json = await res.json();
        if (!res.ok) throw new Error(json.error ?? res.statusText);
        return json;
      }

      async function load() {
        try {
          data = await api('/api/state');
          document.getElementById('error').textContent = '';
        } catch (err) {
          document.getElementById('error').textContent = err.message;
        }
        render();
      }

      async function act(path, body) {
        try {
          await api(path, body);
          await load();
        } catch (err) {
          document.getElementById('error').textContent = err.message;
        }
      }

      function render() {
        const counts = Object.fromEntries(
          FILTERS.map((f) => [
            f,
            f === 'all' ? data.assets.length : data.assets.filter((a) => a.status === f).length,
          ]),
        );
        document.getElementById('filters').replaceChildren(
          ...FILTERS.map((f) =>
            $(
              'button',
              {
                'aria-pressed': String(f === filter),
                onclick: () => {
                  filter = f;
                  render();
                },
              },
              `${f} (${counts[f]})`,
            ),
          ),
        );
        const visible = data.assets.filter((a) => filter === 'all' || a.status === filter);
        const list = document.getElementById('list');
        if (visible.length === 0) {
          list.replaceChildren($('p', { class: 'empty' }, `No assets with status "${filter}".`));
          return;
        }
        list.replaceChildren(...visible.map(renderAsset));
      }

      function renderAsset(a) {
        const cls = [
          a.background === 'transparent' ? 'transparent' : '',
          a.kind !== 'image' ? 'sheet' : '',
        ].join(' ');
        const variants = a.variants.length
          ? $(
              'div',
              { class: 'variants' },
              a.variants.map((n) => {
                const src = `/output/${a.id}/v${n}.png?t=${a.lastRun?.at ?? ''}`;
                const picked = a.picked === n;
                return $(
                  'figure',
                  { class: `${cls} ${picked ? 'picked' : ''}` },
                  $(
                    'div',
                    { class: 'frame' },
                    $('img', {
                      src,
                      alt: `${a.id} variant ${n}`,
                      loading: 'lazy',
                      onclick: () => window.open(src, '_blank'),
                    }),
                  ),
                  $(
                    'figcaption',
                    {},
                    `v${n}`,
                    $(
                      'button',
                      {
                        class: `stamp ${picked ? 'on' : ''}`,
                        onclick: () =>
                          act(picked ? '/api/unpick' : '/api/pick', { id: a.id, variant: n }),
                      },
                      picked ? 'Picked' : 'Pick',
                    ),
                  ),
                );
              }),
            )
          : $(
              'p',
              { class: 'empty' },
              'No variants yet. Run: node tools/assets/generate.mjs --only ' + a.id,
            );

        const slices = a.hasSlices
          ? $(
              'div',
              { class: 'slices' },
              a.sliceLabels.map((e) =>
                $(
                  'figure',
                  {},
                  $('img', { src: `/output/${a.id}/sliced/${e}.png?t=${Date.now()}`, alt: e }),
                  $('figcaption', {}, e),
                ),
              ),
            )
          : null;

        const notes = $('textarea', {
          placeholder: 'Notes for the next generation (what to fix)…',
          onchange: (ev) => act('/api/notes', { id: a.id, notes: ev.target.value }),
        });
        notes.value = a.notes ?? '';

        return $(
          'section',
          { class: 'asset' },
          $(
            'div',
            { class: 'row' },
            $('h2', {}, a.id),
            $('span', { class: `badge status-${a.status}` }, a.status),
            $(
              'span',
              { class: 'meta' },
              `${a.category} · ${a.kind} · ${a.size} · bg ${a.background} · display ${a.displayWidth}px`,
            ),
            a.lastRun
              ? $(
                  'span',
                  { class: 'meta' },
                  `last run ${new Date(a.lastRun.at).toLocaleString()} · ${a.lastRun.model}`,
                )
              : null,
          ),
          $('p', { class: 'desc' }, a.description),
          $(
            'details',
            {},
            $(
              'summary',
              { class: 'meta' },
              a.lastRun ? 'Prompt sent (last run)' : 'Prompt that would be sent',
            ),
            $('pre', {}, a.prompt),
          ),
          variants,
          slices,
          $(
            'div',
            { class: 'actions' },
            notes,
            $(
              'button',
              {
                onclick: () =>
                  confirm(
                    `Mark ${a.id} for regeneration? Its pick is cleared; variants stay on disk.`,
                  ) && act('/api/redo', { id: a.id }),
              },
              'Needs redo',
            ),
          ),
        );
      }

      load();
    </script>
  </body>
</html>
